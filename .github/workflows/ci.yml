name: ci

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: gofmt -w $(git ls-files '*.go') && git diff --exit-code
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./...
